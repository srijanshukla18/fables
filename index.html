<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fables · a reader for agent chronicles</title>
<style>
/* ------------------------------------------------------------------
   Night library. Prose is a book; tools are a terminal.
   amber = the human voice · coral = the machine · violet = its thoughts
------------------------------------------------------------------- */
:root {
  --bg: #16130e;
  --panel: #1d1812;
  --panel-2: #241e15;
  --line: #322a1e;
  --line-soft: #2a2318;
  --ink: #e9e1d0;
  --muted: #998d74;
  --faint: #6d6350;
  --amber: #e3b341;
  --amber-dim: #8a6d2a;
  --coral: #d97757;
  --teal: #7fd4c1;
  --violet: #a99ac6;
  --red: #e5695e;
  --green: #9ab87a;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  display: flex;
  overflow: hidden;
}
::selection { background: var(--amber-dim); color: var(--ink); }
a { color: var(--amber); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------------- sidebar ---------------- */
.sidebar {
  width: 330px;
  flex-shrink: 0;
  height: 100%;
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
}
body.standalone .sidebar { display: none; }
.brand { padding: 22px 20px 16px; border-bottom: 1px solid var(--line); }
.brand h1 {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.brand h1 .ampersandish { color: var(--amber); }
.brand p {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--faint);
  letter-spacing: 1.6px;
  text-transform: uppercase;
  margin-top: 6px;
}
.finder { padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
.finder input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 11px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 12.5px;
}
.finder input::placeholder { color: var(--faint); }
.finder input:focus { outline: none; border-color: var(--amber-dim); }
.chips { display: flex; gap: 6px; }
.chip {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.5px;
  padding: 4px 10px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
}
.chip.on { border-color: var(--amber-dim); color: var(--amber); background: rgba(227,179,65,0.07); }
.shelf { flex: 1; overflow-y: auto; padding: 6px 8px 20px; }
.shelf::-webkit-scrollbar { width: 8px; }
.shelf::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.card {
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--ink);
  display: block;
}
.card:hover { background: var(--panel-2); }
.card.on { background: var(--panel-2); border-color: var(--line); }
.card .t {
  font-family: var(--serif);
  font-size: 14.5px;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card .m {
  margin-top: 5px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--faint);
  display: flex;
  gap: 8px;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
}
.dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
.dot.claude { background: var(--coral); }
.dot.codex { background: var(--teal); }
.card .proj { overflow: hidden; text-overflow: ellipsis; }
.card .when { margin-left: auto; flex-shrink: 0; color: var(--faint); }
.shelf .empty { padding: 30px 16px; color: var(--faint); font-family: var(--mono); font-size: 12px; text-align: center; }

/* ---------------- main ---------------- */
.main { flex: 1; height: 100%; display: flex; flex-direction: column; min-width: 0; }
.mainhead {
  padding: 18px 30px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.mainhead .row1 { display: flex; align-items: baseline; gap: 14px; }
.mainhead h2 { font-size: 21px; font-weight: 600; line-height: 1.3; flex: 1; min-width: 0; }
.actions { display: flex; gap: 8px; flex-shrink: 0; }
.btn {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.5px;
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--amber-dim);
  background: transparent;
  color: var(--amber);
}
.btn:hover { background: rgba(227,179,65,0.1); }
body.standalone .actions { display: none; }
.metastrip {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}
.metastrip .kv b { color: var(--ink); font-weight: 500; }
.metastrip .src { font-weight: 600; }
.metastrip .src.claude { color: var(--coral); }
.metastrip .src.codex { color: var(--teal); }
.searchrow { margin-top: 10px; }
.searchrow input {
  width: 100%;
  max-width: 420px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 11px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 12px;
}
.searchrow input:focus { outline: none; border-color: var(--amber-dim); }

/* ---------------- transcript: the spine ---------------- */
.scroll { flex: 1; overflow-y: auto; }
.scroll::-webkit-scrollbar { width: 10px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
.transcript {
  width: min(1120px, calc(100% - 64px));
  max-width: none;
  margin: 0 auto;
  padding: 34px 34px 120px 52px;
  position: relative;
}
.transcript::before {
  content: "";
  position: absolute;
  left: 26px;
  top: 40px;
  bottom: 80px;
  width: 1px;
  background: var(--line-soft);
}
.welcome { padding: 80px 40px; text-align: center; color: var(--faint); }
.welcome .glyph { font-size: 40px; color: var(--amber-dim); }
.welcome h3 { font-size: 20px; color: var(--muted); margin-top: 18px; font-weight: 500; }
.welcome p { font-family: var(--mono); font-size: 12px; margin-top: 10px; line-height: 1.8; }

.item { position: relative; margin-bottom: 18px; }
.item.hidden { display: none; }

.turnmark {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--faint);
  text-transform: uppercase;
  margin: 30px 0 10px;
  position: relative;
}
.turnmark .turnrun {
  color: var(--muted);
  margin-left: 8px;
  letter-spacing: 1px;
}
.effortscale {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-left: 10px;
  color: var(--faint);
  letter-spacing: 0;
  text-transform: none;
  vertical-align: middle;
}
.metastrip .effortscale { margin-left: 4px; }
.effortscale .endpoint {
  color: var(--muted);
  font-size: 9.5px;
  letter-spacing: 0.4px;
}
.effortscale .rail {
  position: relative;
  display: inline-grid;
  grid-template-columns: repeat(5, 8px);
  gap: 15px;
  align-items: center;
}
.effortscale .rail::before {
  content: "";
  position: absolute;
  left: 4px;
  right: 4px;
  top: 50%;
  height: 1px;
  background: var(--line);
}
.effortscale .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1px solid var(--faint);
  background: var(--bg);
  position: relative;
  z-index: 1;
}
.effortscale .dot.on {
  width: 10px;
  height: 10px;
  margin: -1px;
  background: var(--amber);
  border-color: var(--amber);
  box-shadow: 0 0 0 3px rgba(227,179,65,0.12);
}
.turnmark::before {
  content: "◆";
  position: absolute;
  left: -28.5px;
  top: 1px;
  font-size: 9px;
  color: var(--amber-dim);
}

.speaker {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 6px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.item.user .speaker { color: var(--amber); }
.item.assistant .speaker { color: var(--coral); }
.runmark {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--faint);
  margin: 18px 0 10px;
}
.runmark b { color: var(--muted); font-weight: 500; }
.badge {
  font-size: 9px;
  border: 1px solid var(--line);
  color: var(--faint);
  padding: 1px 6px;
  border-radius: 99px;
  letter-spacing: 1px;
}
.runbadge {
  font-size: 9px;
  letter-spacing: 0.9px;
  color: var(--muted);
  border-color: var(--line-soft);
}

.prose { font-size: 15.5px; line-height: 1.65; }
.item.user .prose {
  background: rgba(227,179,65,0.045);
  border-left: 2px solid var(--amber-dim);
  padding: 12px 16px;
  border-radius: 0 8px 8px 0;
}
.prose p { margin-bottom: 0.8em; }
.prose p:last-child { margin-bottom: 0; }
.prose h1, .prose h2, .prose h3, .prose h4 { margin: 1em 0 0.5em; line-height: 1.3; }
.prose h1 { font-size: 1.35em; } .prose h2 { font-size: 1.2em; }
.prose h3 { font-size: 1.08em; } .prose h4 { font-size: 1em; }
.prose ul, .prose ol { margin: 0 0 0.8em 1.5em; }
.prose li { margin-bottom: 0.25em; }
.prose blockquote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--muted); margin-bottom: 0.8em; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
.prose code {
  font-family: var(--mono);
  font-size: 0.82em;
  background: var(--panel-2);
  border: 1px solid var(--line-soft);
  padding: 1px 5px;
  border-radius: 4px;
}
.prose pre.code {
  background: #100e09;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  padding: 12px 14px;
  margin: 0.8em 0;
  overflow-x: auto;
  position: relative;
}
.prose pre.code[data-lang]::after {
  content: attr(data-lang);
  position: absolute; top: 6px; right: 10px;
  font-family: var(--mono); font-size: 9.5px; color: var(--faint);
  letter-spacing: 1px;
}
.prose pre.code code {
  background: none; border: 0; padding: 0;
  font-size: 12.5px; line-height: 1.55; color: #cfc6b2;
  white-space: pre;
}

/* thinking */
details.think { margin: 2px 0; }
details.think summary {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--violet);
  opacity: 0.75;
  cursor: pointer;
  list-style: none;
  letter-spacing: 0.5px;
}
details.think summary::-webkit-details-marker { display: none; }
details.think summary:hover { opacity: 1; }
details.think .prose {
  font-style: italic;
  color: var(--violet);
  opacity: 0.85;
  font-size: 14px;
  border-left: 1px dotted var(--violet);
  padding: 6px 0 6px 14px;
  margin-top: 6px;
}

/* tools */
details.tool {
  font-family: var(--mono);
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  overflow: hidden;
}
details.tool summary {
  padding: 8px 12px;
  cursor: pointer;
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 12px;
  list-style: none;
  color: var(--muted);
}
details.tool summary::-webkit-details-marker { display: none; }
details.tool summary:hover { background: var(--panel-2); }
details.tool summary .tname { color: var(--ink); font-weight: 600; flex-shrink: 0; }
details.tool summary .targ { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); flex: 1; }
details.tool summary .tstat { flex-shrink: 0; font-size: 11px; }
.tstat.ok { color: var(--green); }
.tstat.err { color: var(--red); }
.tstat.none { color: var(--faint); }
details.tool .tbody { border-top: 1px solid var(--line-soft); padding: 10px 12px; }
details.tool .tlabel {
  font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--faint); margin: 8px 0 4px;
}
details.tool .tlabel:first-child { margin-top: 0; }
details.tool pre {
  font-size: 11.5px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  color: #c4bba7;
  max-height: 480px;
  overflow-y: auto;
  background: #100e09;
  border-radius: 6px;
  padding: 8px 10px;
}
details.tool pre.errout { color: var(--red); }
.morebtn {
  margin-top: 6px;
  font-family: var(--mono); font-size: 10.5px;
  background: none; border: 1px solid var(--line); border-radius: 5px;
  color: var(--muted); padding: 3px 9px;
}
.morebtn:hover { color: var(--ink); }

/* command + info */
.cmd {
  display: inline-block;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--amber);
  background: rgba(227,179,65,0.06);
  border: 1px solid var(--amber-dim);
  border-radius: 6px;
  padding: 4px 12px;
}
.info {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--faint);
  line-height: 1.5;
}
.info .ilabel { letter-spacing: 1px; text-transform: uppercase; font-size: 9.5px; }
details.info summary { cursor: pointer; list-style: none; }
details.info summary::-webkit-details-marker { display: none; }
details.info summary:hover { color: var(--muted); }
details.info pre {
  white-space: pre-wrap; word-break: break-word;
  margin-top: 6px; padding: 8px 10px;
  background: var(--panel); border-radius: 6px;
  max-height: 300px; overflow-y: auto;
}

/* raw peek */
.rawbtn {
  position: absolute;
  right: -6px; top: 0;
  font-family: var(--mono); font-size: 9.5px;
  color: var(--faint);
  background: none; border: none;
  opacity: 0;
  padding: 2px 5px;
}
.item:hover .rawbtn { opacity: 0.7; }
.rawbtn:hover { opacity: 1 !important; color: var(--amber); }
pre.rawview {
  font-family: var(--mono); font-size: 10.5px; line-height: 1.45;
  white-space: pre-wrap; word-break: break-word;
  background: #100e09; border: 1px dashed var(--line);
  border-radius: 6px; padding: 8px 10px; margin-top: 8px;
  color: var(--muted); max-height: 400px; overflow-y: auto;
}

.sentinel { height: 1px; }
.endmark {
  text-align: center;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--faint);
  margin-top: 50px;
  text-transform: uppercase;
}

/* responsive */
.shelftoggle {
  display: none;
  position: fixed;
  left: 12px; bottom: 12px;
  z-index: 50;
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--panel-2);
  border: 1px solid var(--amber-dim);
  color: var(--amber);
  font-size: 17px;
}
@media (max-width: 880px) {
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    z-index: 40;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    width: min(330px, 85vw);
  }
  body.shelf-open .sidebar { transform: translateX(0); }
  body:not(.standalone) .shelftoggle { display: block; }
  .transcript { width: 100%; padding-left: 38px; padding-right: 16px; }
  .transcript::before { left: 16px; }
  .turnmark::before { left: -22.5px; }
  .mainhead { padding: 14px 16px 12px; }
}
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <h1>Fable<span class="ampersandish">s</span></h1>
      <p>a reader for agent chronicles</p>
    </div>
    <div class="finder">
      <input type="text" id="finder" placeholder="find a session…" autocomplete="off">
      <div class="chips">
        <button class="chip on" data-src="">all</button>
        <button class="chip" data-src="claude">claude</button>
        <button class="chip" data-src="codex">codex</button>
      </div>
    </div>
    <nav class="shelf" id="shelf"></nav>
  </aside>

  <main class="main">
    <header class="mainhead" id="mainhead" hidden>
      <div class="row1">
        <h2 id="stitle"></h2>
        <div class="actions">
          <button class="btn" id="shareBtn" title="Export this session as a single standalone HTML file">⤴ share as html</button>
        </div>
      </div>
      <div class="metastrip" id="metastrip"></div>
      <div class="searchrow"><input type="text" id="insearch" placeholder="search within this session…" autocomplete="off"></div>
    </header>
    <div class="scroll" id="scrollpane">
      <div class="transcript" id="transcript">
        <div class="welcome" id="welcome">
          <div class="glyph">❦</div>
          <h3>Every session is a story.</h3>
          <p>Pick a chronicle from the shelf.<br>Claude Code and Codex transcripts, side by side.</p>
        </div>
      </div>
    </div>
  </main>

  <button class="shelftoggle" id="shelftoggle" aria-label="Toggle session list">☰</button>

<script>
"use strict";
/* =====================================================================
   Fables — viewer for Claude Code & Codex session JSONL
   ===================================================================== */

const $ = (id) => document.getElementById(id);
const state = {
  sessions: [],       // listing from /api/sessions
  filterSrc: "",
  current: null,      // listing entry of the open session
  raw: "",            // raw jsonl text of the open session
  parsed: null,       // { meta, items }
  renderedUpto: 0,
  observer: null,
};
const CHUNK = 150;          // items rendered per batch
const PRE_CAP = 15000;      // chars shown in a tool output before "show all"

/* ---------------- utils ---------------- */
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function fmtBytes(n) {
  if (n > 1048576) return (n / 1048576).toFixed(1) + " MB";
  if (n > 1024) return Math.round(n / 1024) + " KB";
  return n + " B";
}
function fmtTokens(n) {
  if (!n) return "0";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
}
function fmtWhen(ts) {
  const d = new Date(ts);
  if (isNaN(d)) return "";
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (sameDay) return time;
  return d.toLocaleDateString([], { day: "numeric", month: "short", year: "2-digit" }) + " " + time;
}
function fmtTime(ts) {
  const d = new Date(ts);
  return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function slug(s) {
  return (s || "session").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "session";
}

/* ---------------- tiny markdown ---------------- */
function mdInline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:!?)]|$)/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s"'<>]+)\)/g,
    (_, label, url) => '<a href="' + url + '" target="_blank" rel="noopener">' + label + '</a>');
  return s;
}
function mdText(src) {
  const lines = src.split("\n");
  let html = "", para = [], list = null; // list: {tag, items}
  const flushPara = () => {
    if (para.length) { html += "<p>" + para.map(mdInline).join("<br>") + "</p>"; para = []; }
  };
  const flushList = () => {
    if (list) { html += "<" + list.tag + ">" + list.items.map(i => "<li>" + mdInline(i) + "</li>").join("") + "</" + list.tag + ">"; list = null; }
  };
  for (const line of lines) {
    const h = line.match(/^(#{1,4})\s+(.*)/);
    const ul = line.match(/^\s*[-*]\s+(.*)/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (h) { flushPara(); flushList(); html += "<h" + h[1].length + ">" + mdInline(h[2]) + "</h" + h[1].length + ">"; }
    else if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { flushPara(); flushList(); html += "<hr>"; }
    else if (ul) { flushPara(); if (!list || list.tag !== "ul") { flushList(); list = { tag: "ul", items: [] }; } list.items.push(ul[1]); }
    else if (ol) { flushPara(); if (!list || list.tag !== "ol") { flushList(); list = { tag: "ol", items: [] }; } list.items.push(ol[1]); }
    else if (/^\s*>\s?/.test(line)) { flushPara(); flushList(); html += "<blockquote>" + mdInline(line.replace(/^\s*>\s?/, "")) + "</blockquote>"; }
    else if (!line.trim()) { flushPara(); flushList(); }
    else { flushList(); para.push(line); }
  }
  flushPara(); flushList();
  return html;
}
function md(src) {
  if (src.length > 60000) {
    // giant pastes read better as plain text than as broken markdown
    return "<pre class='code'><code>" + esc(src) + "</code></pre>";
  }
  const parts = String(src).split("```");
  let html = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      let code = parts[i], lang = "";
      const nl = code.indexOf("\n");
      if (nl > -1 && /^[\w+-]{0,20}$/.test(code.slice(0, nl).trim())) {
        lang = code.slice(0, nl).trim();
        code = code.slice(nl + 1);
      }
      html += "<pre class='code'" + (lang ? " data-lang='" + esc(lang) + "'" : "") + "><code>" + esc(code) + "</code></pre>";
    } else {
      html += mdText(parts[i]);
    }
  }
  return html;
}

/* =====================================================================
   PARSERS — both dialects normalize to:
   { meta: {source, title, cwd, branch, models[], efforts[], tokens{}, start, end, skipped},
     items: [{kind, ts, text, name, input, output, isError, side, label, run, raw[]}] }
   kinds: user · assistant · thinking · tool · command · info
   ===================================================================== */

function parseSession(rawText, hint) {
  const objs = [];
  for (const line of rawText.split("\n")) {
    const t = line.trim();
    if (!t) continue;
    try { objs.push(JSON.parse(t)); } catch (e) { /* torn line: skip, stay alive */ }
  }
  // modern codex wraps everything in {timestamp, type, payload}; 2025-era
  // rollouts are bare response items with {record_type} state lines between
  const isCodex = hint === "codex" || (objs.length &&
    objs.slice(0, 5).some(o => o.payload !== undefined || o.type === "session_meta" ||
      o.record_type !== undefined || (o.git !== undefined && o.id !== undefined)));
  return isCodex ? parseCodex(objs) : parseClaude(objs);
}

/* ---------------- Claude Code ---------------- */
function claudeUserText(text, items, obj, run) {
  const t = String(text);
  if (!t.trim()) return;
  if (t.includes("<local-command-caveat>") && !t.includes("<command-name>")) return;
  if (t.startsWith("Caveat:")) return;
  const cmd = t.match(/<command-name>([^<]*)<\/command-name>/);
  if (cmd) {
    const args = t.match(/<command-args>([^<]*)<\/command-args>/);
    items.push({ kind: "command", ts: obj.timestamp, text: (cmd[1] + " " + (args ? args[1] : "")).trim(), run, raw: [obj] });
    return;
  }
  const stdout = t.match(/<local-command-stdout>([\s\S]*?)<\/local-command-stdout>/);
  if (stdout) {
    if (stdout[1].trim()) items.push({ kind: "info", label: "command output", ts: obj.timestamp, text: stdout[1].trim(), run, raw: [obj] });
    return;
  }
  if (t.startsWith("[Request interrupted")) {
    items.push({ kind: "info", label: "interrupted", ts: obj.timestamp, text: "session interrupted by user", run, raw: [obj] });
    return;
  }
  if (t.startsWith("<system-reminder>")) {
    items.push({ kind: "info", label: "system reminder", ts: obj.timestamp, text: t.replace(/<\/?system-reminder>/g, "").trim(), run, raw: [obj] });
    return;
  }
  items.push({ kind: "user", ts: obj.timestamp, text: t, side: !!obj.isSidechain, run, raw: [obj] });
}

function claudeEffortEvent(text) {
  const t = String(text || "");
  let m = t.match(/Set effort level to\s+([a-z0-9_-]+)/i);
  if (m) return { effort: m[1].toLowerCase(), backfill: false };
  m = t.match(/Kept effort level as\s+([a-z0-9_-]+)/i);
  if (m) return { effort: m[1].toLowerCase(), backfill: true };
  return null;
}

function claudeResultText(block, toolUseResult) {
  const r = toolUseResult;
  if (r) {
    if (typeof r === "string") return r;
    if (r.stdout !== undefined || r.stderr !== undefined) {
      let out = r.stdout || "";
      if (r.stderr) out += (out ? "\n" : "") + "[stderr] " + r.stderr;
      return out || "(no output)";
    }
    if (r.file && r.file.content !== undefined) return r.file.content;
    if (Array.isArray(r.structuredPatch) && r.structuredPatch.length) {
      return r.structuredPatch.map(h =>
        "@@ -" + h.oldStart + "," + h.oldLines + " +" + h.newStart + "," + h.newLines + " @@\n" + h.lines.join("\n")
      ).join("\n");
    }
    if (typeof r.content === "string") return r.content;
  }
  const c = block.content;
  if (typeof c === "string") return c;
  if (Array.isArray(c)) {
    return c.map(p => p.type === "text" ? p.text : p.type === "image" ? "[image]" : "").join("\n");
  }
  return "";
}

function parseClaude(objs) {
  const meta = { source: "claude", title: "", cwd: "", branch: "", models: new Set(),
    efforts: new Set(), tokens: { input: 0, output: 0, reasoning: 0, cacheRead: 0, cacheWrite: 0 },
    start: "", end: "", skipped: 0 };
  const items = [];
  const pending = new Map(); // tool_use_id -> tool item
  let currentRun = {};
  let firstEffort = null;

  for (const obj of objs) {
    if (obj.timestamp) {
      if (!meta.start) meta.start = obj.timestamp;
      meta.end = obj.timestamp;
    }
    if (obj.cwd && !meta.cwd) meta.cwd = obj.cwd;
    if (obj.gitBranch && !meta.branch) meta.branch = obj.gitBranch;

    switch (obj.type) {
      case "summary":
        if (obj.summary && !meta.title) meta.title = obj.summary;
        break;
      case "ai-title":
        if (obj.aiTitle) meta.title = obj.aiTitle;
        break;
      case "user": {
        const content = obj.message && obj.message.content;
        if (typeof content === "string") {
          if (!obj.isMeta) {
            const effort = claudeEffortEvent(content);
            if (effort) {
              currentRun = { ...currentRun, effort: effort.effort };
              meta.efforts.add(currentRun.effort);
              if (!firstEffort) firstEffort = { ...effort, ts: obj.timestamp };
            }
            claudeUserText(content, items, obj, { ...currentRun });
          }
        } else if (Array.isArray(content)) {
          for (const block of content) {
            if (block.type === "text") {
              if (!obj.isMeta) {
                const effort = claudeEffortEvent(block.text);
                if (effort) {
                  currentRun = { ...currentRun, effort: effort.effort };
                  meta.efforts.add(currentRun.effort);
                  if (!firstEffort) firstEffort = { ...effort, ts: obj.timestamp };
                }
                claudeUserText(block.text, items, obj, { ...currentRun });
              }
            } else if (block.type === "tool_result") {
              const t = pending.get(block.tool_use_id);
              if (t) {
                t.output = claudeResultText(block, obj.toolUseResult);
                t.isError = !!block.is_error;
                t.raw.push(obj);
              }
            } else if (block.type === "image") {
              items.push({ kind: "user", ts: obj.timestamp, text: "[image attached]", side: !!obj.isSidechain, run: { ...currentRun }, raw: [obj] });
            }
          }
        }
        break;
      }
      case "assistant": {
        const m = obj.message || {};
        const realModel = m.model && m.model !== "<synthetic>" ? m.model : "";
        if (realModel) meta.models.add(realModel);
        const run = { ...currentRun };
        if (realModel) run.model = realModel;
        if (m.usage) {
          meta.tokens.input += m.usage.input_tokens || 0;
          meta.tokens.output += m.usage.output_tokens || 0;
          meta.tokens.reasoning += m.usage.reasoning_output_tokens || 0;
          meta.tokens.cacheRead += m.usage.cache_read_input_tokens || 0;
          meta.tokens.cacheWrite += m.usage.cache_creation_input_tokens || 0;
        }
        const content = Array.isArray(m.content) ? m.content : [];
        for (const block of content) {
          if (block.type === "thinking" && block.thinking && block.thinking.trim()) {
            items.push({ kind: "thinking", ts: obj.timestamp, text: block.thinking, side: !!obj.isSidechain, run, raw: [obj] });
          } else if (block.type === "text" && block.text && block.text.trim()) {
            items.push({ kind: "assistant", ts: obj.timestamp, text: block.text, side: !!obj.isSidechain, run, raw: [obj] });
          } else if (block.type === "tool_use") {
            const t = { kind: "tool", ts: obj.timestamp, name: block.name, input: block.input,
              output: null, isError: false, side: !!obj.isSidechain, run, raw: [obj] };
            pending.set(block.id, t);
            items.push(t);
          }
        }
        break;
      }
      case "system":
        if (typeof obj.content === "string" && obj.content.trim() && obj.level !== "suggestion") {
          items.push({ kind: "info", label: obj.subtype || "system", ts: obj.timestamp, text: obj.content, raw: [obj] });
        }
        break;
      default:
        meta.skipped++;
    }
  }
  if (firstEffort && firstEffort.backfill) {
    for (const item of items) {
      if (item.ts && item.ts > firstEffort.ts) break;
      item.run = { ...(item.run || {}), effort: (item.run && item.run.effort) || firstEffort.effort };
    }
  }
  return { meta, items };
}

/* ---------------- Codex ---------------- */
function codexJoin(content) {
  if (typeof content === "string") return content;
  if (Array.isArray(content)) return content.map(c => c.text || "").join("");
  return "";
}
function codexOutput(out) {
  if (out == null) return "";
  if (typeof out === "object") out = out.output !== undefined ? out.output : JSON.stringify(out, null, 1);
  if (typeof out === "string" && out.length < 200000 && (out[0] === "{" || out[0] === "[")) {
    try {
      const o = JSON.parse(out);
      if (o && typeof o === "object" && typeof o.output === "string") return o.output;
    } catch (e) { /* fine, it was just text */ }
  }
  return String(out);
}
const CODEX_CONTEXT_PREFIXES = ["<permissions", "<environment_context", "<user_instructions",
  "<turn_aborted", "# AGENTS.md", "<AGENTS", "<app_context", "<system_status"];

function parseCodex(objs) {
  const meta = { source: "codex", title: "", cwd: "", branch: "", models: new Set(),
    efforts: new Set(), tokens: { input: 0, output: 0, reasoning: 0, cacheRead: 0, cacheWrite: 0 },
    start: "", end: "", skipped: 0 };
  const items = [];
  const pending = new Map(); // call_id -> tool item
  let currentRun = null;

  const BARE_ITEMS = new Set(["message", "reasoning", "function_call", "function_call_output",
    "custom_tool_call", "custom_tool_call_output", "local_shell_call", "web_search_call"]);

  for (const obj of objs) {
    let p = obj.payload || {};
    let kind = obj.type;
    if (obj.payload === undefined) { // 2025-era bare format
      if (obj.record_type !== undefined) continue;
      if (BARE_ITEMS.has(obj.type)) { p = obj; kind = "response_item"; }
      else if (obj.git !== undefined) { // legacy header line
        if (obj.git && obj.git.branch) meta.branch = obj.git.branch;
        continue;
      }
    }
    const ts = obj.timestamp || p.timestamp;
    if (ts) { if (!meta.start) meta.start = ts; meta.end = ts; }

    switch (kind) {
      case "session_meta":
        meta.cwd = p.cwd || meta.cwd;
        if (p.git && p.git.branch) meta.branch = p.git.branch;
        break;
      case "turn_context":
        if (p.model) meta.models.add(p.model);
        if (p.effort) meta.efforts.add(p.effort);
        currentRun = {
          model: p.model || (currentRun && currentRun.model) || "",
          effort: p.effort || (currentRun && currentRun.effort) || "",
        };
        if (p.cwd && !meta.cwd) meta.cwd = p.cwd;
        break;
      case "response_item": {
        const pt = p.type;
        if (pt === "message") {
          const text = codexJoin(p.content);
          if (!text.trim()) break;
          if (p.role === "assistant") {
            items.push({ kind: "assistant", ts, text, run: currentRun, raw: [obj] });
          } else if (p.role === "user") {
            const trimmed = text.trim();
            if (CODEX_CONTEXT_PREFIXES.some(pre => trimmed.startsWith(pre))) {
              items.push({ kind: "info", label: "injected context", ts, text: trimmed, run: currentRun, raw: [obj] });
            } else {
              items.push({ kind: "user", ts, text, run: currentRun, raw: [obj] });
            }
          } else { // developer / system
            items.push({ kind: "info", label: p.role + " message", ts, text, run: currentRun, raw: [obj] });
          }
        } else if (pt === "reasoning") {
          const text = (p.summary || []).map(s => s.text || "").join("\n\n") ||
                       codexJoin(p.content);
          if (text.trim()) items.push({ kind: "thinking", ts, text, run: currentRun, raw: [obj] });
        } else if (pt && pt.endsWith("_call_output")) {
          const t = pending.get(p.call_id);
          if (t) {
            t.output = codexOutput(p.output);
            if (/^exec_command failed|error/i.test(t.output.slice(0, 40))) t.isError = true;
            t.raw.push(obj);
          }
        } else if (pt && (pt.endsWith("_call") || pt === "local_shell_call")) {
          let input = p.arguments;
          if (typeof input === "string") { try { input = JSON.parse(input); } catch (e) { /* keep raw */ } }
          if (input === undefined) input = p.action || p.input || {};
          const t = { kind: "tool", ts, name: p.name || pt.replace(/_call$/, ""), input,
            output: null, isError: false, run: currentRun, raw: [obj] };
          if (p.call_id) pending.set(p.call_id, t);
          items.push(t);
        } else {
          meta.skipped++;
        }
        break;
      }
      case "event_msg": {
        const pt = p.type;
        if (pt === "thread_name_updated" && p.thread_name) meta.title = meta.title || p.thread_name;
        else if (pt === "token_count" && p.info && p.info.total_token_usage) {
          const u = p.info.total_token_usage; // cumulative; input includes cache
          meta.tokens.cacheRead = u.cached_input_tokens || 0;
          meta.tokens.input = (u.input_tokens || 0) - meta.tokens.cacheRead;
          meta.tokens.output = u.output_tokens || 0;
          meta.tokens.reasoning = u.reasoning_output_tokens || 0;
        } else meta.skipped++; // user/agent messages here duplicate response_items
        break;
      }
      case "compacted":
        items.push({ kind: "info", label: "compacted", ts, text: "context was compacted here", raw: [obj] });
        break;
      default:
        meta.skipped++;
    }
  }
  return { meta, items };
}

/* =====================================================================
   RENDERING
   ===================================================================== */

function toolArgSummary(input) {
  if (input == null) return "";
  if (typeof input === "string") return input;
  const cand = input.command || input.cmd || input.file_path || input.path ||
    input.pattern || input.query || input.url || input.prompt || input.description || "";
  if (cand) return String(cand);
  const keys = Object.keys(input);
  return keys.length ? keys.map(k => k + ": " + String(input[k]).slice(0, 30)).join(", ").slice(0, 100) : "";
}
function runLabel(run) {
  if (!run) return "";
  const parts = [];
  if (run.model) parts.push(run.model);
  return parts.join(" · ");
}
function runKey(run) {
  return run && (run.model || run.effort) ? (run.model || "") + "\n" + (run.effort || "") : "";
}
const EFFORT_LEVELS = ["low", "medium", "high", "xhigh", "max"];
function normalizedEffort(effort) {
  const e = String(effort || "").toLowerCase().replace(/[_\s-]+/g, "");
  if (e === "low" || e === "minimal") return "low";
  if (e === "medium" || e === "med") return "medium";
  if (e === "high") return "high";
  if (e === "xhigh" || e === "extrahigh" || e === "extra") return "xhigh";
  if (e === "max" || e === "maximum") return "max";
  return "";
}
function effortScale(effort) {
  const raw = Array.isArray(effort) ? effort : [effort];
  const levels = new Set(raw.map(normalizedEffort).filter(Boolean));
  if (!levels.size) return null;
  const wrap = document.createElement("span");
  wrap.className = "effortscale";
  wrap.title = "reasoning depth: faster \u2192 smarter";
  const faster = document.createElement("span");
  faster.className = "endpoint";
  faster.textContent = "Faster";
  wrap.appendChild(faster);
  const rail = document.createElement("span");
  rail.className = "rail";
  for (const l of EFFORT_LEVELS) {
    const dot = document.createElement("span");
    dot.className = "dot" + (levels.has(l) ? " on" : "");
    dot.title = l;
    rail.appendChild(dot);
  }
  wrap.appendChild(rail);
  const smarter = document.createElement("span");
  smarter.className = "endpoint";
  smarter.textContent = "Smarter";
  wrap.appendChild(smarter);
  return wrap;
}

function preBlock(text, cls) {
  const full = String(text);
  const wrap = document.createElement("div");
  const pre = document.createElement("pre");
  if (cls) pre.className = cls;
  if (full.length > PRE_CAP) {
    pre.textContent = full.slice(0, PRE_CAP);
    const btn = document.createElement("button");
    btn.className = "morebtn";
    btn.textContent = "show all " + fmtBytes(full.length);
    btn.addEventListener("click", () => { pre.textContent = full; btn.remove(); });
    wrap.appendChild(pre);
    wrap.appendChild(btn);
  } else {
    pre.textContent = full;
    wrap.appendChild(pre);
  }
  return wrap;
}

function renderItem(item, idx, turnNo, runChanged) {
  const frag = document.createDocumentFragment();
  if (item.kind === "user" && !item.side) {
    const mark = document.createElement("div");
    mark.className = "turnmark";
    mark.textContent = "turn " + turnNo + (item.ts ? " · " + fmtTime(item.ts) : "");
    if (item.run && item.run.effort) {
      const scale = effortScale(item.run.effort);
      if (scale) mark.appendChild(scale);
    }
    frag.appendChild(mark);
  }
  const rlabel = runLabel(item.run);
  if (runChanged && rlabel) {
    const mark = document.createElement("div");
    mark.className = "runmark";
    mark.innerHTML = "setting <b>" + esc(rlabel) + "</b>";
    frag.appendChild(mark);
  }
  const el = document.createElement("div");
  el.className = "item " + item.kind;
  el.dataset.idx = idx;
  el.dataset.search = ((item.text || "") + " " + (item.name || "") + " " + toolArgSummary(item.input)).toLowerCase();

  if (item.kind === "user" || item.kind === "assistant") {
    const sp = document.createElement("div");
    sp.className = "speaker";
    sp.textContent = item.kind === "user" ? "you" : "the machine";
    if (item.side) {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = "sidechain";
      sp.appendChild(b);
    }
    if (item.kind === "assistant" && rlabel) {
      const b = document.createElement("span");
      b.className = "badge runbadge";
      b.textContent = rlabel;
      sp.appendChild(b);
    }
    el.appendChild(sp);
    const prose = document.createElement("div");
    prose.className = "prose";
    prose.innerHTML = md(item.text || "");
    el.appendChild(prose);
  } else if (item.kind === "thinking") {
    const d = document.createElement("details");
    d.className = "think";
    const s = document.createElement("summary");
    s.textContent = "✳ thinking · " + fmtBytes(item.text.length).replace(" B", " chars");
    d.appendChild(s);
    const prose = document.createElement("div");
    prose.className = "prose";
    prose.innerHTML = md(item.text);
    d.appendChild(prose);
    el.appendChild(d);
  } else if (item.kind === "tool") {
    const d = document.createElement("details");
    d.className = "tool";
    const s = document.createElement("summary");
    const stat = item.output === null ? ["none", "·"] : item.isError ? ["err", "✗"] : ["ok", "✓"];
    s.innerHTML = "<span class='tname'>⌘ " + esc(item.name || "tool") + "</span>" +
      "<span class='targ'>" + esc(toolArgSummary(item.input).slice(0, 160)) + "</span>" +
      "<span class='tstat " + stat[0] + "'>" + stat[1] + "</span>";
    d.appendChild(s);
    const body = document.createElement("div");
    body.className = "tbody";
    const linput = document.createElement("div"); linput.className = "tlabel"; linput.textContent = "input";
    body.appendChild(linput);
    const inputText = typeof item.input === "string" ? item.input : JSON.stringify(item.input, null, 2);
    body.appendChild(preBlock(inputText || "(none)"));
    const lout = document.createElement("div"); lout.className = "tlabel";
    lout.textContent = item.output === null ? "no result recorded" : item.isError ? "result · error" : "result";
    body.appendChild(lout);
    if (item.output !== null) body.appendChild(preBlock(item.output || "(empty)", item.isError ? "errout" : ""));
    d.appendChild(body);
    el.appendChild(d);
  } else if (item.kind === "command") {
    const c = document.createElement("span");
    c.className = "cmd";
    c.textContent = "» " + item.text;
    el.appendChild(c);
  } else if (item.kind === "info") {
    if ((item.text || "").length > 120) {
      const d = document.createElement("details");
      d.className = "info";
      const s = document.createElement("summary");
      s.innerHTML = "<span class='ilabel'>◦ " + esc(item.label || "note") + "</span> <span>· " + fmtBytes(item.text.length).replace(" B", " chars") + "</span>";
      d.appendChild(s);
      const pre = document.createElement("pre");
      pre.textContent = item.text;
      d.appendChild(pre);
      el.className += " info";
      el.appendChild(d);
    } else {
      el.className += " info";
      el.innerHTML = "<span class='ilabel'>◦ " + esc(item.label || "note") + "</span> " + esc(item.text || "");
    }
  }

  // raw JSONL peek
  const rb = document.createElement("button");
  rb.className = "rawbtn";
  rb.textContent = "{raw}";
  rb.title = "Show the raw JSONL behind this block";
  rb.addEventListener("click", () => {
    const existing = el.querySelector("pre.rawview");
    if (existing) { existing.remove(); return; }
    const pre = document.createElement("pre");
    pre.className = "rawview";
    pre.textContent = (item.raw || []).map(o => JSON.stringify(o, null, 1)).join("\n---\n").slice(0, 100000);
    el.appendChild(pre);
  });
  el.appendChild(rb);

  frag.appendChild(el);
  return frag;
}

function renderChunk() {
  const { items } = state.parsed;
  const container = $("transcript");
  const end = Math.min(state.renderedUpto + CHUNK, items.length);
  let turnNo = state.turnCount || 0;
  const frag = document.createDocumentFragment();
  for (let i = state.renderedUpto; i < end; i++) {
    if (items[i].kind === "user" && !items[i].side) turnNo++;
    const key = runKey(items[i].run);
    const changed = !!key && key !== state.lastRunKey;
    if (key) state.lastRunKey = key;
    frag.appendChild(renderItem(items[i], i, turnNo, changed));
  }
  state.turnCount = turnNo;
  state.renderedUpto = end;
  const sentinel = $("sentinel");
  container.insertBefore(frag, sentinel);
  if (end >= items.length) {
    if (sentinel) sentinel.remove();
    if (state.observer) state.observer.disconnect();
    const fin = document.createElement("div");
    fin.className = "endmark";
    fin.textContent = "· fin ·";
    container.appendChild(fin);
  }
  applyInSearch();
}

function renderSession() {
  const { meta, items } = state.parsed;
  $("welcome") && $("welcome").remove();
  const container = $("transcript");
  container.innerHTML = "";
  state.renderedUpto = 0;
  state.turnCount = 0;
  state.lastRunKey = "";

  // header
  $("mainhead").hidden = false;
  $("stitle").textContent = meta.title || (state.current && state.current.title) || "untitled session";
  document.title = ($("stitle").textContent) + " · Fables";
  const chips = [];
  chips.push("<span class='src " + meta.source + "'>" + (meta.source === "claude" ? "claude code" : "codex") + "</span>");
  const models = [...meta.models];
  if (models.length) chips.push("<span class='kv'>" + (models.length === 1 ? "model" : "models") +
    " <b>" + esc(models.join(", ")) + "</b></span>");
  const efforts = meta.efforts ? [...meta.efforts].filter(Boolean) : [];
  if (meta.cwd) chips.push("<span class='kv'>cwd <b>" + esc(meta.cwd.replace(/^\/Users\/[^/]+/, "~")) + "</b></span>");
  if (meta.branch && meta.branch !== "HEAD") chips.push("<span class='kv'>⎇ <b>" + esc(meta.branch) + "</b></span>");
  if (meta.start) chips.push("<span class='kv'>" + esc(fmtWhen(meta.start)) + (meta.end && meta.end !== meta.start ? " → " + esc(fmtWhen(meta.end)) : "") + "</span>");
  const tk = meta.tokens;
  if (tk.input + tk.output + tk.cacheRead > 0) {
    chips.push("<span class='kv'>tokens <b>" + fmtTokens(tk.input) + " in · " + fmtTokens(tk.output) + " out</b>" +
      (tk.reasoning ? " · " + fmtTokens(tk.reasoning) + " thinking" : "") +
      (tk.cacheRead ? " · " + fmtTokens(tk.cacheRead) + " cached" : "") + "</span>");
  }
  const nTools = items.filter(i => i.kind === "tool").length;
  const nTurns = items.filter(i => i.kind === "user" && !i.side).length;
  chips.push("<span class='kv'><b>" + nTurns + "</b> turns · <b>" + nTools + "</b> tool calls</span>");
  $("metastrip").innerHTML = chips.join("");
  if (efforts.length) {
    const chip = document.createElement("span");
    chip.className = "kv";
    chip.appendChild(document.createTextNode("reasoning "));
    const scale = effortScale(efforts);
    if (scale) chip.appendChild(scale);
    $("metastrip").insertBefore(chip, $("metastrip").children[1] || null);
  }

  // body, chunked
  const sentinel = document.createElement("div");
  sentinel.className = "sentinel";
  sentinel.id = "sentinel";
  container.appendChild(sentinel);
  if (state.observer) state.observer.disconnect();
  state.observer = new IntersectionObserver((entries) => {
    if (entries.some(e => e.isIntersecting)) renderChunk();
  }, { root: $("scrollpane"), rootMargin: "1200px" });
  state.observer.observe(sentinel);
  renderChunk();
  $("scrollpane").scrollTop = 0;
}

/* ---------------- in-session search ---------------- */
function applyInSearch() {
  const q = $("insearch").value.trim().toLowerCase();
  const els = document.querySelectorAll("#transcript .item");
  for (const el of els) {
    el.classList.toggle("hidden", q.length >= 2 && !el.dataset.search.includes(q));
  }
  const marks = document.querySelectorAll("#transcript .turnmark");
  for (const m of marks) m.style.display = q.length >= 2 ? "none" : "";
}

/* ---------------- sidebar ---------------- */
function renderShelf() {
  const q = $("finder").value.trim().toLowerCase();
  const shelf = $("shelf");
  shelf.innerHTML = "";
  let shown = 0;
  for (const s of state.sessions) {
    if (state.filterSrc && s.source !== state.filterSrc) continue;
    if (q && !(s.title + " " + s.project).toLowerCase().includes(q)) continue;
    shown++;
    const b = document.createElement("button");
    b.className = "card" + (state.current && state.current.id === s.id ? " on" : "");
    b.innerHTML = "<div class='t'>" + esc(s.title) + "</div>" +
      "<div class='m'><span class='dot " + s.source + "'></span>" +
      (s.sub ? "<span class='badge'>⑂ sub</span>" : "") +
      "<span class='proj'>" + esc(s.project || s.source) + "</span>" +
      "<span class='when'>" + esc(fmtWhen(s.mtime * 1000)) + " · " + fmtBytes(s.size) + "</span></div>";
    b.addEventListener("click", () => openSession(s));
    shelf.appendChild(b);
  }
  if (!shown) {
    shelf.innerHTML = "<div class='empty'>nothing on this shelf.</div>";
  }
}

async function openSession(s) {
  try {
    const res = await fetch("/api/session/" + s.id);
    if (!res.ok) throw new Error("HTTP " + res.status);
    state.raw = await res.text();
  } catch (e) {
    alert("Couldn't load that session: " + e.message);
    return;
  }
  state.current = s;
  location.hash = "s=" + s.id;
  state.parsed = parseSession(state.raw, s.source);
  if (!state.parsed.meta.title) state.parsed.meta.title = s.title;
  renderSession();
  renderShelf();
  document.body.classList.remove("shelf-open");
}

/* ---------------- share: standalone html export ---------------- */
async function exportStandalone() {
  const btn = $("shareBtn");
  btn.textContent = "binding…";
  try {
    const src = await (await fetch("/")).text(); // pristine copy of this page
    // "</" never appears in JSON outside strings; "<\/" is the same string, so
    // this keeps the parser from ending our inert data script early.
    const safeData = state.raw.replace(/<\//g, "<\\/");
    const metaJson = JSON.stringify({
      source: state.parsed.meta.source,
      title: $("stitle").textContent,
      project: state.current ? state.current.project : "",
    }).replace(/<\//g, "<\\/");
    const inject =
      '\n<script type="application/x-jsonl" id="embedded-data">' + safeData + "<\/script>" +
      '\n<script type="application/json" id="embedded-meta">' + metaJson + "<\/script>\n";
    // function replacement: raw JSONL may contain $& / $' which string
    // replacements would expand as substitution patterns
    const out = src.replace("<\/body>", () => inject + "<\/body>");
    const blob = new Blob([out], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "fable-" + slug($("stitle").textContent) + ".html";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    btn.textContent = "⤴ shared ✓";
  } catch (e) {
    alert("Export failed: " + e.message);
    btn.textContent = "⤴ share as html";
    return;
  }
  setTimeout(() => { btn.textContent = "⤴ share as html"; }, 2500);
}

/* ---------------- boot ---------------- */
async function boot() {
  const embedded = document.getElementById("embedded-data");
  if (embedded) {
    // standalone exported file: no server, no shelf — just the story
    document.body.classList.add("standalone");
    let em = {};
    try { em = JSON.parse(document.getElementById("embedded-meta").textContent); } catch (e) {}
    state.raw = embedded.textContent;
    state.current = { id: "embedded", title: em.title || "shared session", project: em.project || "", source: em.source };
    state.parsed = parseSession(state.raw, em.source);
    if (!state.parsed.meta.title) state.parsed.meta.title = em.title || "";
    renderSession();
    return;
  }

  try {
    const res = await fetch("/api/sessions");
    state.sessions = (await res.json()).sessions;
  } catch (e) {
    $("shelf").innerHTML = "<div class='empty'>couldn't reach serve.py — is it running?</div>";
    return;
  }
  renderShelf();
  const want = (location.hash.match(/s=([a-f0-9]+)/) || [])[1];
  if (want) {
    const s = state.sessions.find(x => x.id === want);
    if (s) openSession(s);
  }
}

$("finder").addEventListener("input", renderShelf);
$("insearch").addEventListener("input", applyInSearch);
$("shareBtn").addEventListener("click", exportStandalone);
$("shelftoggle").addEventListener("click", () => document.body.classList.toggle("shelf-open"));
for (const chip of document.querySelectorAll(".chip")) {
  chip.addEventListener("click", () => {
    state.filterSrc = chip.dataset.src;
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === chip));
    renderShelf();
  });
}

// exported files carry their data in scripts injected after this one,
// so wait for the full document before looking for them
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
</body>
</html>
